<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17"><meta name="referrer" content="no-referrer"><title>Busca Recente</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,Roboto,sans-serif;background:#0b0f17;color:#e8ecf4}
header{position:sticky;top:0;z-index:5;background:rgba(11,15,23,.96);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 10px) 12px 6px;border-bottom:1px solid #1b2436}
.brand{font-weight:700;font-size:18px;margin:0 0 8px 4px}.brand span{color:#5b9cff}
form{display:flex;gap:8px}#q{flex:1;min-width:0;font-size:17px;padding:13px 16px;border-radius:16px;border:1px solid #2a3650;background:#141b2b;color:#fff;outline:none}#q:focus{border-color:#5b9cff}
.go{border:0;border-radius:16px;background:#3b82f6;color:#fff;font-size:18px;padding:0 16px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 2px}.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #2a3650;background:#141b2b;color:#cfd6e4;padding:8px 13px;border-radius:999px;font-size:14px}.chip.on{background:#3b82f6;border-color:#3b82f6;color:#fff;font-weight:600}
.tabs .chip{border-radius:10px}
.dates{display:none;gap:8px;padding-top:6px}.dates.show{display:flex}.dates label{flex:1;font-size:12px;color:#8a94a8}.dates input{width:100%;margin-top:3px;padding:9px;border-radius:10px;border:1px solid #2a3650;background:#141b2b;color:#fff;font-size:15px;color-scheme:dark}
main{padding:10px 12px 40px;max-width:760px;margin:0 auto}.st{color:#8a94a8;font-size:13px;margin:6px 2px 10px}
.r{padding:12px 4px;border-bottom:1px solid #182033}.r a{color:inherit;text-decoration:none}.src{font-size:12.5px;color:#8a94a8;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}.src img{width:16px;height:16px;border-radius:4px}
.t{color:#9ec2ff;font-size:17px;margin:4px 0;line-height:1.3}.c{color:#b7c0d1;font-size:14px;line-height:1.45}.d{color:#f4b860;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#141b2b}
.v{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #182033}.v .th{position:relative;flex:none;width:42%}.v .th img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#141b2b}
.du{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.8);font-size:12px;padding:1px 5px;border-radius:4px}.v .t{font-size:15px}
.more{display:block;margin:18px auto;padding:12px 22px;border-radius:14px;border:1px solid #2a3650;background:#141b2b;color:#cfd6e4;font-size:15px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:10;display:none;flex-direction:column;justify-content:center;align-items:center;padding:20px}#lb.show{display:flex}
#lb img{max-width:100%;max-height:75vh;object-fit:contain}#lb .cap{margin-top:12px;text-align:center;font-size:14px}#lb a{color:#9ec2ff}#lb .x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;font-size:30px;background:none;border:0;color:#fff}
.sp{width:28px;height:28px;border:3px solid #2a3650;border-top-color:#5b9cff;border-radius:50%;animation:s 1s linear infinite;margin:30px auto}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<header><div class="brand">Busca <span>Recente</span></div>
<form id="f"><input id="q" type="search" placeholder="Pesquisar…" autocomplete="off" enterkeyhint="search"><button class="go" aria-label="Buscar">🔍</button></form>
<div class="row tabs" id="tabs"><button class="chip" data-v="all">Tudo</button><button class="chip" data-v="images">Imagens</button><button class="chip" data-v="videos">Vídeos</button><button class="chip" data-v="news">Notícias</button></div>
<div class="row" id="per"><button class="chip" data-v="hour">Última hora</button><button class="chip" data-v="day">24h</button><button class="chip" data-v="week">Semana</button><button class="chip" data-v="month">Mês</button><button class="chip" data-v="year">Ano</button><button class="chip" data-v="custom">📅 Data exata</button><button class="chip" id="sort">⇅ Mais recentes</button></div>
<div class="dates" id="dates"><label>De<input type="date" id="from"></label><label>Até<input type="date" id="to"></label></div>
</header>
<main><div class="st" id="st">Digite algo e escolha o período. Sem anúncios.</div><div id="res"></div><button class="more" id="more" hidden>Mais resultados</button></main>
<div id="lb"><button class="x" id="lbx">×</button><img id="lbi" alt=""><div class="cap" id="lbc"></div></div>
<script>
var API='https://busca-recente-api.onrender.com/api/search';
var S=JSON.parse(localStorage.getItem('br2')||'{}');S.range=S.range||'month';S.tab=S.tab||'all';
var $=function(i){return document.getElementById(i)},page=1,busy=false,cur='',seen={};
function save(){localStorage.setItem('br2',JSON.stringify(S))}
function paint(){[['per','range'],['tabs','tab']].forEach(function(a){document.querySelectorAll('#'+a[0]+' .chip[data-v]').forEach(function(c){c.classList.toggle('on',c.dataset.v===S[a[1]])})});
$('sort').classList.toggle('on',!!S.sort);$('dates').classList.toggle('show',S.range==='custom');$('from').value=S.from||'';$('to').value=S.to||''}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}}
function fd(d){if(!d)return'';var t=new Date(d),m=(Date.now()-t)/6e4;if(m<60)return'há '+Math.max(1,Math.round(m))+' min';if(m<1440)return'há '+Math.round(m/60)+' h';if(m<43200)return'há '+Math.round(m/1440)+' dias';return t.toLocaleDateString('pt-BR')}
function dur(x){if(!x)return'';if(typeof x==='number'){var s=Math.round(x);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}return String(x).replace(/^0:(\d\d:)/,'$1')}
function card(r){if(S.tab==='images')return '<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(r.thumb||r.img)+'" data-full="'+esc(r.img||r.thumb)+'" data-url="'+esc(r.url)+'" data-t="'+esc(r.title)+'">';
 if(S.tab==='videos')return '<a class="v" href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer"><div class="th"><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(r.thumb||'')+'">'+(r.duration?'<span class="du">'+esc(dur(r.duration))+'</span>':'')+'</div><div><div class="t">'+esc(r.title)+'</div><div class="src">'+esc(host(r.url))+'</div><div class="d">'+fd(r.date)+'</div></div></a>';
 return '<div class="r"><a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer"><div class="src">'+esc(host(r.url))+(r.date?' · <span class="d">'+fd(r.date)+'</span>':'')+'</div><div class="t">'+esc(r.title)+'</div><div class="c">'+esc(r.content)+'</div></a></div>'}
function run(reset){var q=$('q').value.trim();if(!q||busy)return;if(S.range==='custom'&&!S.from&&!S.to){$('st').textContent='Escolha a data De e/ou Até.';return}
 if(reset){page=1;seen={};$('res').innerHTML=S.tab==='images'?'<div class="grid" id="g"></div>':'';history.replaceState(null,'','?q='+encodeURIComponent(q))}
 busy=true;$('more').hidden=true;var sp=document.createElement('div');sp.className='sp';$('res').after(sp);$('st').textContent=page===1?'Buscando…':$('st').textContent;
 var p={q:q,tab:S.tab,range:S.range,page:page};if(S.sort)p.sort='date';if(S.range==='custom'){if(S.from)p.from=S.from;if(S.to)p.to=S.to}
 var key=JSON.stringify(p);cur=key;var t0=Date.now(),slow=setTimeout(function(){$('st').textContent='Acordando o servidor… (pode levar ~30s na primeira vez)'},4000);
 var tries=0;function load(){return fetch(API+'?'+new URLSearchParams(p),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).catch(function(e){if(++tries<6&&cur===key){$('st').textContent='Acordando o servidor… tentativa '+(tries+1)+'/6';return new Promise(function(ok){setTimeout(ok,5000)}).then(load)}throw e})}
 load().then(function(d){if(cur!==key)return;
  var rs=(d.results||[]).filter(function(r){if(seen[r.url])return false;seen[r.url]=1;return S.tab!=='images'||r.img||r.thumb});
  var h=rs.map(card).join('');if(S.tab==='images')$('g').insertAdjacentHTML('beforeend',h);else $('res').insertAdjacentHTML('beforeend',h);
  var n=Object.keys(seen).length;$('st').textContent=n?n+' resultados · '+((Date.now()-t0)/1000).toFixed(1)+'s'+(d.ads_removed?' · '+d.ads_removed+' anúncios removidos':''):'Nada encontrado nesse período. Tente um período maior.';
  $('more').hidden=!(d.results||[]).length;page++}).catch(function(e){$('st').textContent='Erro ao buscar ('+(e&&e.message||e)+'). Toque em 🔍 para tentar de novo.'}).finally(function(){clearTimeout(slow);busy=false;sp.remove()})}
$('f').onsubmit=function(e){e.preventDefault();$('q').blur();run(true)};
function pick(id,k){$(id).onclick=function(e){var v=e.target.dataset&&e.target.dataset.v;if(v==null)return;S[k]=v;save();paint();if(v!=='custom'||S.from||S.to)run(true)}}
pick('per','range');pick('tabs','tab');
$('sort').onclick=function(){S.sort=!S.sort;save();paint();run(true)};
$('from').onchange=function(){S.from=this.value;save();run(true)};$('to').onchange=function(){S.to=this.value;save();run(true)};
$('more').onclick=function(){run(false)};
new IntersectionObserver(function(e){if(e[0].isIntersecting&&!$('more').hidden)run(false)},{rootMargin:'600px'}).observe($('more'));
$('res').onclick=function(e){var i=e.target;if(!i.dataset||!i.dataset.full)return;$('lbi').src=i.dataset.full;$('lbc').innerHTML=esc(i.dataset.t)+'<br><a href="'+esc(i.dataset.url)+'" target="_blank" rel="noopener noreferrer">Abrir no site ↗ '+esc(host(i.dataset.url))+'</a>';$('lb').classList.add('show');history.pushState({lb:1},'')};
function closeLb(){$('lb').classList.remove('show');$('lbi').src=''}
$('lbx').onclick=function(){history.back()};$('lb').onclick=function(e){if(e.target.id==='lb')history.back()};window.onpopstate=function(){closeLb()};
paint();var P=new URLSearchParams(location.search).get('q');if(P){$('q').value=P;run(true)}else $('q').focus();
fetch(API.replace('/api/search','/health')).catch(function(){});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=3').then(function(r){r.update()});
</script></body></html>
